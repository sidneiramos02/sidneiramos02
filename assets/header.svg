<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Sidnei Ramos Marques — Desenvolvedor de Software</title>
  <desc id="desc">Banner profissional com formas abstratas inspiradas em código e tecnologia</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081426"/>
      <stop offset="0.52" stop-color="#102A43"/>
      <stop offset="1" stop-color="#123B4A"/>
    </linearGradient>
    <radialGradient id="light" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#FFFFFF" stroke-opacity="0.045"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="24" fill="url(#grid)"/>
  <circle cx="1020" cy="115" r="230" fill="url(#light)"/>

  <g opacity="0.72" fill="none" stroke="#2DD4BF" stroke-width="2">
    <path d="M820 58h86l31 31h91"/>
    <path d="M858 148h70l26-26h126"/>
    <path d="M800 224h99l34-34h171"/>
    <circle cx="820" cy="58" r="5" fill="#2DD4BF"/>
    <circle cx="858" cy="148" r="5" fill="#2DD4BF"/>
    <circle cx="800" cy="224" r="5" fill="#2DD4BF"/>
    <circle cx="1028" cy="89" r="5" fill="#2DD4BF"/>
    <circle cx="1080" cy="122" r="5" fill="#2DD4BF"/>
    <circle cx="1104" cy="190" r="5" fill="#2DD4BF"/>
  </g>

  <g transform="translate(935 88)" fill="none" stroke="#E6FFFB" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M-24 28-58 62l34 34"/>
    <path d="m74 28 34 34-34 34"/>
    <path d="m47 5-42 114"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="82" y="88" fill="#2DD4BF" font-size="18" font-weight="700" letter-spacing="4">DESENVOLVEDOR DE SOFTWARE</text>
    <text x="78" y="157" fill="#FFFFFF" font-size="54" font-weight="800">Sidnei Ramos Marques</text>
    <text x="82" y="207" fill="#D9EAF0" font-size="22">Back End • Liderança de times • Produtos digitais</text>
    <rect x="82" y="236" width="72" height="4" rx="2" fill="#2DD4BF"/>
  </g>
</svg>
